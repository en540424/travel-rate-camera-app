<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR結果（失敗）</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#EAEEEC;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:40px;}
  .bezel{background:#0E1413;border-radius:46px;padding:9px;box-shadow:0 2px 5px rgba(16,33,31,0.1),0 34px 60px -30px rgba(16,33,31,0.55);}
  .screen{width:300px;height:648px;background:#11201E;border-radius:38px;overflow:hidden;position:relative;display:flex;flex-direction:column;}
  .statusbar{height:42px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 22px 0;position:relative;z-index:6;}
  .statusbar .time{font:600 14px -apple-system,system-ui;color:#fff;letter-spacing:-0.01em;}
  .island{position:absolute;left:50%;top:9px;transform:translateX(-50%);width:78px;height:22px;background:#0E1413;border-radius:999px;}
  .screen-body{flex:1;overflow:hidden;display:flex;flex-direction:column;margin-top:-42px;}
</style>
</head>
<body>
<!-- screen: ocr-failed / 状態: OCR失敗 → 手入力 -->
<div class="bezel">
  <div class="screen">
    <div class="statusbar">
      <span class="time">12:09</span>
      <div class="island"></div>
      <div style="display:flex;align-items:center;gap:7px;color:#fff;"><svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"></rect><rect x="4.5" y="5" width="3" height="6" rx="1"></rect><rect x="9" y="2.5" width="3" height="8.5" rx="1"></rect><rect x="13.5" y="0" width="3" height="11" rx="1"></rect></svg><div style="width:23px;height:11.5px;border:1.3px solid #fff;border-radius:3px;padding:1.4px;"><div style="width:82%;height:100%;background:#fff;border-radius:1px;"></div></div></div>
    </div>
    <div class="screen-body">
      <div style="height:100%;display:flex;flex-direction:column;background:#11201E;">
        <div style="height:40px;flex:none;position:relative;background:repeating-linear-gradient(135deg,#6E7771,#6E7771 14px,#67706A 14px,#67706A 28px);"><div style="position:absolute;inset:0;background:rgba(16,33,31,0.5);"></div></div>
        <div style="flex:1;background:#fff;border-radius:24px 24px 0 0;margin-top:-18px;position:relative;z-index:2;display:flex;flex-direction:column;padding:9px 0 0;box-shadow:0 -10px 30px rgba(16,33,31,0.2);">
          <div style="width:38px;height:5px;border-radius:999px;background:#E0E5E2;margin:0 auto 9px;"></div>
          <div style="flex:1;overflow:hidden;padding:0 15px;">
            <div style="display:flex;align-items:center;gap:9px;margin-bottom:14px;">
              <div style="width:32px;height:32px;border-radius:8px;flex:none;background:repeating-linear-gradient(135deg,#C9D0CB,#C9D0CB 5px,#BFC7C1 5px,#BFC7C1 10px);"></div>
              <span style="flex:1;font:700 12.5px -apple-system,system-ui;color:#16211F;">読み取り結果</span>
              <span style="width:24px;height:24px;border-radius:999px;background:#F1F4F2;display:flex;align-items:center;justify-content:center;color:#7E8986;flex:none;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></span>
            </div>
            <div style="background:#FBF6EC;border:1px solid #F0E6CF;border-radius:16px;padding:16px;text-align:center;margin-bottom:14px;">
              <div style="width:42px;height:42px;border-radius:999px;background:#FBF1DE;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;color:#B5731A;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"></path><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg></div>
              <div style="font:700 14.5px -apple-system,system-ui;color:#16211F;">金額を読み取れませんでした</div>
              <div style="font:500 12px -apple-system,system-ui;color:#7E8986;margin-top:4px;">手入力するか、もう一度撮ってください</div>
            </div>
            <div style="font:600 11px -apple-system,system-ui;color:#7E8986;margin-bottom:7px;">金額を手入力</div>
            <div style="height:58px;border-radius:15px;border:1.5px solid #0E9488;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;margin-bottom:11px;">
              <span style="font:700 28px -apple-system,system-ui;color:#B7BFBC;letter-spacing:-0.02em;font-feature-settings:'tnum';">0.00</span>
              <span style="font:600 14px -apple-system,system-ui;color:#939E9B;">$ USD</span>
            </div>
            <div style="display:flex;align-items:center;gap:7px;font:600 11.5px -apple-system,system-ui;color:#939E9B;"><span>メモ</span><span style="color:#16211F;background:#F5F7F6;border:1px solid #E7EBE9;padding:5px 9px;border-radius:999px;white-space:nowrap;">＋ BBQ BEEF</span></div>
          </div>
          <div style="flex:none;border-top:1px solid #EEF1F0;padding:11px 15px 14px;background:#fff;display:flex;gap:9px;">
            <div style="flex:none;width:110px;height:48px;border-radius:14px;background:#fff;border:1.5px solid #DCE3E0;color:#16211F;display:flex;align-items:center;justify-content:center;gap:6px;font:600 14px -apple-system,system-ui;white-space:nowrap;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v3.5h3.5"></path></svg>撮り直す</div>
            <div style="flex:1;height:48px;border-radius:14px;background:#0E9488;color:#fff;display:flex;align-items:center;justify-content:center;font:600 15px -apple-system,system-ui;box-shadow:0 8px 18px -8px rgba(14,148,136,0.55);white-space:nowrap;">手入力で記録</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
