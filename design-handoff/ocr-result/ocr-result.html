<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR結果（成功）</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#EAEEEC;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:40px;}
  .bezel{background:#0E1413;border-radius:46px;padding:9px;box-shadow:0 2px 5px rgba(16,33,31,0.1),0 34px 60px -30px rgba(16,33,31,0.55);}
  .screen{width:300px;height:648px;background:#11201E;border-radius:38px;overflow:hidden;position:relative;display:flex;flex-direction:column;}
  .statusbar{height:42px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 22px 0;position:relative;z-index:6;}
  .statusbar .time{font:600 14px -apple-system,system-ui;color:#fff;letter-spacing:-0.01em;}
  .island{position:absolute;left:50%;top:9px;transform:translateX(-50%);width:78px;height:22px;background:#0E1413;border-radius:999px;}
  .screen-body{flex:1;overflow:hidden;display:flex;flex-direction:column;margin-top:-42px;}
</style>
</head>
<body>
<!-- screen: ocr-result / 状態: OCR成功・1画面完結（結果パネル） -->
<div class="bezel">
  <div class="screen">
    <div class="statusbar">
      <span class="time">12:09</span>
      <div class="island"></div>
      <div style="display:flex;align-items:center;gap:7px;color:#fff;"><svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"></rect><rect x="4.5" y="5" width="3" height="6" rx="1"></rect><rect x="9" y="2.5" width="3" height="8.5" rx="1"></rect><rect x="13.5" y="0" width="3" height="11" rx="1"></rect></svg><div style="width:23px;height:11.5px;border:1.3px solid #fff;border-radius:3px;padding:1.4px;"><div style="width:82%;height:100%;background:#fff;border-radius:1px;"></div></div></div>
    </div>

    <div class="screen-body">
      <div style="height:100%;display:flex;flex-direction:column;background:#11201E;">
        <!-- camera peek strip -->
        <div style="height:40px;flex:none;position:relative;background:repeating-linear-gradient(135deg,#6E7771,#6E7771 14px,#67706A 14px,#67706A 28px);"><div style="position:absolute;inset:0;background:rgba(16,33,31,0.5);"></div></div>
        <!-- result sheet -->
        <div style="flex:1;background:#fff;border-radius:24px 24px 0 0;margin-top:-18px;position:relative;z-index:2;display:flex;flex-direction:column;padding:9px 0 0;box-shadow:0 -10px 30px rgba(16,33,31,0.2);">
          <div style="width:38px;height:5px;border-radius:999px;background:#E0E5E2;margin:0 auto 9px;"></div>
          <div style="flex:1;overflow:hidden;padding:0 15px;">
            <!-- CapturedThumbRow -->
            <div style="display:flex;align-items:center;gap:9px;margin-bottom:10px;">
              <div style="width:32px;height:32px;border-radius:8px;flex:none;background:repeating-linear-gradient(135deg,#C9D0CB,#C9D0CB 5px,#BFC7C1 5px,#BFC7C1 10px);"></div>
              <span style="flex:1;font:700 12.5px -apple-system,system-ui;color:#16211F;">読み取り完了</span>
              <span style="font:600 11.5px -apple-system,system-ui;color:#0E9488;white-space:nowrap;">撮り直す</span>
              <span style="width:24px;height:24px;border-radius:999px;background:#F1F4F2;display:flex;align-items:center;justify-content:center;color:#7E8986;flex:none;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></span>
            </div>
            <!-- ConvertedHero -->
            <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:8px;">
              <div><div style="font:600 10.5px -apple-system,system-ui;letter-spacing:0.05em;text-transform:uppercase;color:#0E9488;margin-bottom:1px;">日本円で</div><div style="font:700 48px/0.95 -apple-system,system-ui;color:#16211F;letter-spacing:-0.035em;font-feature-settings:'tnum';">¥788</div></div>
              <div style="text-align:right;"><div style="font:700 16px -apple-system,system-ui;color:#16211F;font-feature-settings:'tnum';">$4.99</div><div style="font:600 10.5px -apple-system,system-ui;color:#939E9B;margin-top:2px;">会員価格</div></div>
            </div>
            <div style="display:inline-flex;align-items:center;gap:6px;background:#E7F5F2;border-radius:999px;padding:5px 12px;margin-bottom:12px;"><span style="font:600 11px -apple-system,system-ui;color:#0A766E;">保存後の残り予算</span><span style="font:700 13px -apple-system,system-ui;color:#0A766E;font-feature-settings:'tnum';">¥55,344</span></div>
            <!-- CandidateChips -->
            <div style="display:flex;gap:6px;margin-bottom:12px;">
              <div style="flex:1;border:2px solid #0E9488;background:#E7F5F2;border-radius:12px;padding:7px 5px;text-align:center;"><div style="font:700 14px/1 -apple-system,system-ui;color:#16211F;font-feature-settings:'tnum';">¥788</div><div style="font:600 9.5px -apple-system,system-ui;color:#7E8986;margin-top:3px;font-feature-settings:'tnum';">$4.99</div></div>
              <div style="flex:1;border:1.5px solid #E7EBE9;border-radius:12px;padding:7px 5px;text-align:center;"><div style="font:700 14px/1 -apple-system,system-ui;color:#16211F;font-feature-settings:'tnum';">¥1,026</div><div style="font:600 9.5px -apple-system,system-ui;color:#939E9B;margin-top:3px;font-feature-settings:'tnum';">$6.49</div></div>
              <div style="flex:1;border:1.5px solid #E7EBE9;border-radius:12px;padding:7px 5px;text-align:center;"><div style="font:700 14px/1 -apple-system,system-ui;color:#16211F;font-feature-settings:'tnum';">¥237</div><div style="font:600 9.5px -apple-system,system-ui;color:#939E9B;margin-top:3px;font-feature-settings:'tnum';">$1.50</div></div>
            </div>
            <!-- MemoPicker -->
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap;">
              <span style="font:600 11px -apple-system,system-ui;color:#939E9B;">メモ</span>
              <span style="display:inline-flex;align-items:center;gap:4px;font:600 11.5px -apple-system,system-ui;color:#fff;background:#0E9488;padding:5px 9px;border-radius:999px;"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>BBQ BEEF</span>
              <span style="font:600 11.5px -apple-system,system-ui;color:#16211F;background:#F5F7F6;border:1px solid #E7EBE9;padding:5px 9px;border-radius:999px;">＋ BRISKET</span>
              <span style="font:600 11.5px -apple-system,system-ui;color:#5B6764;background:#fff;border:1px solid #E7EBE9;padding:5px 9px;border-radius:999px;white-space:nowrap;">自由入力</span>
            </div>
            <!-- SavePhotoRow -->
            <div style="background:#F5F7F6;border-radius:13px;padding:10px 11px 11px;margin-bottom:9px;">
              <div style="display:flex;align-items:center;gap:7px;margin-bottom:8px;">
                <span style="font:700 11.5px -apple-system,system-ui;color:#16211F;">履歴に残す写真</span>
                <span style="font:500 9px -apple-system,system-ui;color:#A2ACA8;">履歴・候補一覧で見返す用</span>
              </div>
              <div style="display:flex;align-items:center;gap:10px;">
                <div style="position:relative;width:44px;height:44px;flex:none;">
                  <div style="width:44px;height:44px;border-radius:10px;background:repeating-linear-gradient(135deg,#C9D0CB,#C9D0CB 5px,#BFC7C1 5px,#BFC7C1 10px);"></div>
                  <span style="position:absolute;left:-3px;bottom:-4px;font:700 7.5px -apple-system,system-ui;color:#fff;background:#16211F;padding:1.5px 5px;border-radius:999px;white-space:nowrap;">値札</span>
                </div>
                <div style="flex:1;min-width:0;">
                  <div style="font:600 11.5px -apple-system,system-ui;color:#0A766E;">いまは値札（OCR）の写真</div>
                  <div style="font:500 10px/1.35 -apple-system,system-ui;color:#7E8986;margin-top:2px;">商品写真に変えると履歴で見返しやすくなります</div>
                </div>
              </div>
              <div style="display:flex;gap:7px;margin-top:10px;">
                <div style="flex:1;height:38px;border-radius:11px;background:#0E9488;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 5px 12px -7px rgba(14,148,136,0.7);"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2.5"></rect><circle cx="12" cy="13" r="3.2"></circle><path d="M8 6l1.2-2h5.6L16 6"></path></svg><span style="font:700 12.5px -apple-system,system-ui;white-space:nowrap;">商品写真を撮る</span></div>
                <div style="flex:none;display:flex;align-items:center;gap:5px;height:38px;padding:0 12px;border-radius:11px;background:#fff;border:1px solid #E1E6E3;color:#5B6764;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><circle cx="9" cy="11" r="2"></circle><path d="m21 17-5-5-4 4-2-2-4 4"></path></svg><span style="font:600 11.5px -apple-system,system-ui;white-space:nowrap;">他から</span></div>
              </div>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;padding:2px 2px 0;"><span style="font:600 11.5px -apple-system,system-ui;color:#7E8986;white-space:nowrap;">OCR全文を見る</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A6AEAB" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></div>
          </div>
          <!-- ResultFooter（固定） -->
          <div style="flex:none;border-top:1px solid #EEF1F0;padding:9px 15px 13px;background:#fff;">
            <div style="display:flex;background:#EFF2F0;border-radius:11px;padding:3px;margin-bottom:9px;">
              <div style="flex:1;height:32px;border-radius:8px;background:#FBF1DE;color:#B5731A;display:flex;align-items:center;justify-content:center;font:600 12.5px -apple-system,system-ui;box-shadow:0 1px 3px rgba(176,115,26,0.18);">候補に保存</div>
              <div style="flex:1;height:32px;display:flex;align-items:center;justify-content:center;font:600 12.5px -apple-system,system-ui;color:#7E8986;">購入済みにする</div>
            </div>
            <div style="height:52px;border-radius:15px;background:#0E9488;color:#fff;display:flex;align-items:center;justify-content:center;gap:7px;font:600 16px -apple-system,system-ui;box-shadow:0 8px 18px -8px rgba(14,148,136,0.55);white-space:nowrap;font-feature-settings:'tnum';margin-bottom:7px;">¥788 を候補に保存</div>
            <div style="display:flex;align-items:center;justify-content:center;gap:6px;height:22px;"><span style="font:600 13px -apple-system,system-ui;color:#7E8986;">保存せず次の商品へ</span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7E8986" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
