<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v2 写真アクションシート</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#EAEEEC;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:40px;}
  .bezel{background:#0E1413;border-radius:46px;padding:9px;box-shadow:0 2px 5px rgba(16,33,31,0.1),0 34px 60px -30px rgba(16,33,31,0.55);}
  .screen{width:300px;height:648px;background:#F4F6F5;border-radius:38px;overflow:hidden;position:relative;display:flex;flex-direction:column;}
  .row-btn{border-radius:16px;border:1.5px solid #ECEFED;background:#fff;padding:15px 0;display:flex;align-items:center;justify-content:center;gap:8px;font:700 15px -apple-system,system-ui;color:#16211F;}
</style>
</head>
<body>
<!-- screen: photo-action-sheet-v2 / 状態: 写真アクションシート（ボトムシート・背面dim） -->
<div class="bezel">
  <div class="screen">

    <!-- 背面（保存確認カードが薄く見える前提） -->
    <div style="position:absolute;inset:0;background:repeating-linear-gradient(180deg,#F4F6F5,#F4F6F5 60px,#EDF0EE 60px,#EDF0EE 120px);"></div>
    <!-- dim -->
    <div style="position:absolute;inset:0;background:rgba(17,32,30,0.4);"></div>

    <!-- ボトムシート -->
    <div style="position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:16px 18px 28px;box-shadow:0 -10px 30px rgba(0,0,0,0.22);display:flex;flex-direction:column;gap:10px;">
      <!-- グラバー -->
      <div style="align-self:center;width:38px;height:5px;border-radius:999px;background:#E2E7E4;margin-bottom:4px;"></div>

      <div style="text-align:center;font:700 17px -apple-system,system-ui;color:#16211F;">保存する写真</div>
      <div style="text-align:center;font:500 13px -apple-system,system-ui;color:#7E8986;margin-bottom:6px;">履歴で見返す写真を設定します</div>

      <!-- 撮影（主導線・teal淡） -->
      <div class="row-btn" style="background:#E7F5F2;border-color:#D7EDE7;color:#0A766E;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A766E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2.5"></rect><circle cx="12" cy="13" r="3.2"></circle><path d="M8 6l1.2-2h5.6L16 6"></path></svg>商品写真を撮る
      </div>

      <!-- ライブラリから選択 -->
      <div class="row-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16211F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"></rect><circle cx="8.5" cy="9.5" r="1.8"></circle><path d="M21 16l-5-5L5 20"></path></svg>写真ライブラリから選ぶ
      </div>

      <!-- OCR写真を使う（OCR撮影済みのときのみ表示） -->
      <div class="row-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16211F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2"></path><circle cx="12" cy="12" r="3"></circle></svg>OCR撮影した写真を使う
      </div>

      <!-- 削除（danger） -->
      <div class="row-btn" style="background:#FBF3F1;border-color:#F0D9D4;color:#C2543F;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#C2543F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6 7l1 13h10l1-13"></path></svg>写真を削除
      </div>

      <!-- キャンセル -->
      <div class="row-btn" style="border-color:#DCE3E0;color:#5B6764;margin-top:2px;">キャンセル</div>
    </div>

  </div>
</div>
</body>
</html>
