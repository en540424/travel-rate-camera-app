# E-NEXUS共通 素材生成：iOSシミュレーターで実アプリを撮影するジョブ（tools/store-assets の job-*）。
#
# 【起動】次の2つだけ。PR・schedule・他のbranchへの push では動かない。
#   1. ci/store-assets-ios/<ジョブID> への push（job-dispatch --execute が「ジョブのcommit＋.github/store-assets/job.json」だけのcommitを作って push する）
#      届いたcommitがその形でなければ、job-ci-resolve が撮影の前に止める。
#   2. workflow_dispatch（このファイルが既定branchに入った後だけ使える。入れるのはHuman判断）
# 【費用】公開repoの標準ランナー（macos-26）は無料（GitHub Docs「GitHub Actions billing」・「GitHub-hosted runners」）。
#   larger runner は公開repoでも課金なので使わない。privateへ移すと有料（その時は止めて見直す）。
# 【公開】公開repoのログ・成果物は誰でも見られる前提。secrets を一切使わない。撮影はテスト用のデータだけ。
#   成果物は撮影結果（result.json と PNG）だけで、保存は3日。
name: store-assets-ios

on:
  push:
    branches:
      - 'ci/store-assets-ios/**'
  workflow_dispatch:
    inputs:
      job_json:
        description: tools/store-assets の job.json の中身（job-create で作ったもの）
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # ジョブ（専用branch）ごとに分ける。共通の group だと待機中の古いジョブが GitHub の仕様で取り消される
  group: store-assets-ios-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPO_NO_TELEMETRY: '1'
  CI: 'true'
  # 画面の操作の道具（Maestro）：統計の送信・更新の確認を止める（入れる step の --version から効かせるため job 全体に置く）。
  # 道具の起動の待ち時間は既定 15 秒（公式の環境変数の表）。CI の初回は遅いので 5 分にする
  MAESTRO_CLI_NO_ANALYTICS: 'true'
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
  MAESTRO_DISABLE_UPDATE_CHECK: 'true'
  MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'

jobs:
  capture:
    if: ${{ !github.event.repository.fork }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: ジョブを確かめる（入力は環境変数で受け、シェルへ直接埋め込まない）
        id: job
        env:
          JOB_JSON: ${{ inputs.job_json }}
        run: node tools/store-assets/engine/cli.mjs job-ci-resolve --out "$RUNNER_TEMP/job.json"

      - name: ジョブのcommitへ移る（/ios は prebuild が作る未追跡のフォルダなので、このランナーの中だけで無視する）
        env:
          COMMIT: ${{ steps.job.outputs.commit }}
        run: |
          git checkout --quiet --detach "$COMMIT"
          test "$(git rev-parse HEAD)" = "$COMMIT"
          printf '/ios/\n' >> .git/info/exclude
          test -z "$(git status --porcelain)"

      - run: npm ci --no-audit --no-fund

      - name: Expo の事前コンパイル版どうしの記号がそろっていることを確かめる（そろっていないとアプリは起動の瞬間に終了する。build の前に止める）
        run: node tools/native-check/expo-prebuilt-abi.mjs

      - name: ネイティブのプロジェクトを作る
        run: npx expo prebuild --platform ios --no-install

      - name: prebuild が書き換えた追跡ファイルを戻す（撮影の commit と作業ツリーを一致させる）
        run: |
          git checkout -- .
          git status --porcelain
          test -z "$(git status --porcelain)"

      - run: pod install
        working-directory: ios

      - name: シミュレーター向けに build（署名なし・EAS Build は使わない）
        run: |
          set -o pipefail
          WS=$(ls -d ios/*.xcworkspace | head -1)
          NAME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$NAME" -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || { tail -n 120 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }
          tail -n 5 "$RUNNER_TEMP/xcodebuild.log"
          # JS の本体を同梱する手順（Bundle React Native code and images）が動いたかを残す（2026-11-21 の3回目は末尾5行しか残らず、確かめられなかった）
          grep -nE 'Bundle React Native code|react-native-xcode|export:embed|main\.jsbundle|hermesc|SKIP_BUNDLING|error:' "$RUNNER_TEMP/xcodebuild.log" | cut -c1-300 | tail -n 40 || true
          APP=$(ls -d "$RUNNER_TEMP"/dd/Build/Products/Release-iphonesimulator/*.app | head -1)
          test -d "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      # 操作が要る画面（例：換算の金額の入力）だけが使う道具。版と sha256 を固定して GitHub の release から入れる
      # （インストール用のスクリプトを流さない）。入らなくても撮影は止めない：操作が要る画面だけ「撮らなかった理由」を残して飛ばす
      - name: 画面の操作の道具（Maestro CLI 2.12.1・sha256 を確かめて入れる）
        continue-on-error: true
        env:
          MAESTRO_URL: https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.12.1/maestro.zip
          MAESTRO_SHA256: 54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7
        run: |
          set -euo pipefail
          # 失敗は撮影を止めないが、注記として run の画面に出す（「道具が入っていない」だけでは原因が分からない）
          trap 'echo "::warning title=Maestro::Maestro を入れられなかった（操作が要る画面は撮らずに飛ばす）"' ERR
          java -version 2>&1 | head -n 1
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/maestro.zip" "$MAESTRO_URL"
          if ! echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -; then
            echo "::warning title=Maestro::zip の sha256 が固定値と違う（改ざん・差し替えの可能性。入れない）"
            exit 1
          fi
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          BIN="$(dirname "$(find "$RUNNER_TEMP/maestro-cli" -type f -path '*/bin/maestro' | head -n 1)")"
          test -x "$BIN/maestro"
          echo "$BIN" >> "$GITHUB_PATH"
          "$BIN/maestro" --version

      - name: 撮影（既存の iOS 撮影手順を job-run で実行。commit の一致・sha256・撮影環境の記録）
        env:
          # アプリが落ちた時、クラッシュの記録（.ips）が書かれるのを待つ秒数（高負荷では書き込みが遅れる）
          IOS_IPS_WAIT: '60'
        run: node tools/store-assets/engine/cli.mjs job-run --job "$RUNNER_TEMP/job.json" --out "$RUNNER_TEMP/result" --app "$APP"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.job.outputs.id != ''
        with:
          name: store-assets-${{ steps.job.outputs.id }}
          path: |
            ${{ runner.temp }}/result/result.json
            ${{ runner.temp }}/result/captures
          retention-days: 3
          if-no-files-found: warn
